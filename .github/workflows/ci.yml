name: Continuous Integration & Security Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gate:
    name: Code Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Secret Scanning Audit
        run: bash .githooks/pre-commit

      - name: Run Biome Code Analysis & Format Audit
        run: npx biome check ./src

      - name: Run Vitest Unit & Integration Suite
        run: npx vitest run

      - name: Execute TypeScript Compilation Check
        run: npx tsc --noEmit
